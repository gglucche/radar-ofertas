name: varrer

on:
  schedule:
    - cron: "*/30 * * * *" # a cada 30 min (GitHub pode atrasar alguns minutos)
  workflow_dispatch:
    inputs:
      buscar:
        description: "Buscar um produto agora e mandar o resultado no Telegram (opcional)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: varrer
  cancel-in-progress: false

jobs:
  varrer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Os servidores DNS do gatry.com (UOL) não respondem a resolvedores fora do Brasil,
      # mas o site fica num load balancer da AWS cujo nome resolve de qualquer lugar.
      # Se o Gatry trocar de infraestrutura, atualize o nome abaixo (dig CNAME gatry.com de dentro do BR).
      - name: DNS alternativo para gatry.com
        env:
          GATRY_CNAME: Gatry-Load-Balancer-186380728.us-east-1.elb.amazonaws.com
        run: |
          if ! getent hosts gatry.com >/dev/null; then
            IP=$(dig +short "$GATRY_CNAME" @1.1.1.1 | grep -E '^[0-9.]+$' | head -1)
            if [ -n "$IP" ]; then echo "$IP gatry.com" | sudo tee -a /etc/hosts; else echo "não resolveu $GATRY_CNAME"; fi
          fi

      - name: Varrer fontes, detectar e notificar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPICO: ${{ secrets.NTFY_TOPICO }}
        run: node src/cli.js varrer

      - name: Busca sob demanda
        if: ${{ github.event.inputs.buscar != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUSCA: ${{ github.event.inputs.buscar }}
        run: node src/cli.js buscar "$BUSCA" --notificar

      - name: Guardar histórico no repositório
        run: |
          git config user.name "radar-ofertas[bot]"
          git config user.email "radar-ofertas@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "nada mudou"
            exit 0
          fi
          git commit -m "dados: varredura $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git push
