name: diagnostico

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: DNS alternativo para gatry.com
        env:
          GATRY_CNAME: Gatry-Load-Balancer-186380728.us-east-1.elb.amazonaws.com
        run: |
          if ! getent hosts gatry.com >/dev/null; then
            IP=$(dig +short "$GATRY_CNAME" @1.1.1.1 | grep -E '^[0-9.]+$' | head -1)
            if [ -n "$IP" ]; then echo "$IP gatry.com" | sudo tee -a /etc/hosts; else echo "não resolveu $GATRY_CNAME"; fi
          fi
      - name: Fontes via Node (mesmo código da varredura)
        run: node src/cli.js diagnostico
      - name: Fontes via curl (status, IP, cabeçalhos)
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
          for u in "https://www.pelando.com.br/recentes" "https://gatry.com/promocoes" "https://api.promobit.com.br/offers" "https://servicespub.prod.api.aws.grupokabum.com.br/catalog/v2/products?query=ssd&page_size=1"; do
            echo "== $u"
            curl -sS -D /tmp/h -o /tmp/b -w "http %{http_code} ip %{remote_ip} tempo %{time_total}s bytes %{size_download}\n" -A "$UA" -H "accept-language: pt-BR,pt;q=0.9" --max-time 30 "$u" || echo "curl falhou: $?"
            grep -iE "^(server|cf-ray|cf-mitigated|location|content-type):" /tmp/h || true
            head -c 200 /tmp/b | tr '\n' ' '; echo
          done
      - name: DNS do gatry.com e API do Pelando
        run: |
          echo "== resolvedor padrao"; dig +short gatry.com || true
          echo "== 1.1.1.1"; dig +short gatry.com @1.1.1.1 || true
          echo "== 8.8.8.8"; dig +short gatry.com @8.8.8.8 || true
          echo "== NS"; dig +short NS gatry.com @1.1.1.1 || true
          echo "== DoH"; curl -s -H 'accept: application/dns-json' 'https://cloudflare-dns.com/dns-query?name=gatry.com&type=A' | head -c 300; echo
          IP=$(dig +short gatry.com @1.1.1.1 | head -1)
          if [ -n "$IP" ]; then echo "== gatry via --resolve $IP"; curl -sS -o /tmp/g -w "http %{http_code} bytes %{size_download}\n" --resolve "gatry.com:443:$IP" --max-time 30 "https://gatry.com/promocoes" || echo "curl falhou: $?"; fi
          echo "== api-web.pelando"; curl -sS -D - -o /tmp/p -w "http %{http_code}\n" --max-time 30 "https://api-web.pelando.com.br/" | grep -iE "^(http|server|cf-mitigated|content-type)" ; head -c 200 /tmp/p; echo
          echo "== pelando sitemap"; curl -sS -o /tmp/s -w "http %{http_code} bytes %{size_download}\n" --max-time 30 "https://www.pelando.com.br/sitemap.xml" || true
